<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game Hub - Login</title>
  <link rel="stylesheet" href="global.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">Theme: Royal</button>

  <section class="card">
    <h1 data-text="GAME HUB">GAME HUB</h1>
    <p class="subtitle">Please login or register to play</p>
    
    <form id="loginForm" class="form-column">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" required />
      </div>
      <div class="field" style="margin-top: 12px;">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" required />
      </div>
      
      <p id="errorMessage" class="error-message hidden"></p>

      <div class="btn-row">
        <button type="submit" id="loginBtn" class="btn outline">Login</button>
        <button type="button" id="registerBtn" class="btn">Register</button>
      </div>
    </form>
  </section>

  <script src="global.js"></script>
  <script src="index.js"></script>
</body>
</html>
