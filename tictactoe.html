<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="global.css"/>
  <link rel="stylesheet" href="tictactoe.css"/>
</head>
<body>
  <nav class="header-nav">
    <a href="hub.html" class="btn">Game Hub</a>
    <a href="dashboard.html" class="btn">Dashboard</a>
    <button id="logoutBtn" class="btn danger">Logout</button>
  </nav>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">Theme: Royal</button>

  <section id="menuScreen" class="card">
    <h1 class="glitch" data-text="TIC-TAC-TOE">Tic Tac Toe</h1>
    <p class="subtitle">Choose your mode & options</p>

    <div class="form-row">
      <div class="field">
        <label for="playerX">Player X Name</label>
        <input id="playerX" type="text" placeholder="Player X"/>
      </div>
      <div class="field">
        <label for="playerO">Player O Name</label>
        <input id="playerO" type="text" placeholder="Player O (or AI)"/>
      </div>
    </div>
    
    <div class="form-row">
      <label class="checkbox">
        <input id="enableTimer" type="checkbox"/>
        <span>Enable per-move timer (10s)</span>
      </label>
      <label class="checkbox">
        <input id="tournamentMode" type="checkbox"/>
        <span>Tournament Mode (Best of 3)</span>
      </label>
    </div>

    <div id="aiOptions" class="form-row hidden">
      <div class="field small">
        <label for="aiDifficulty">BOT Difficulty</label>
        <select id="aiDifficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard" selected>Hard</option>
        </select>
      </div>
      <label class="checkbox">
        <input id="aiFirst" type="checkbox"/>
        <span>BOT plays first</span>
      </label>
    </div>

    <div class="btn-row">
      <button id="playHuman" class="btn">Play vs Human</button>
      <button id="playAI" class="btn outline">Play vs BOT</button>
    </div>
  </section>

  <section id="gameScreen" class="card hidden">
    <div class="topbar">
      <h2 id="status">Ready</h2>
      <div class="timer" id="timerBox" aria-live="polite">Timer: —</div>
    </div>

    <div id="board" class="board"></div>

    <div class="scorebar">
      <div class="score"><span id="nameX">Player X</span> Wins: <strong id="scoreX">0</strong></div>
      <div class="score">Draws: <strong id="scoreD">0</strong></div>
      <div class="score"><span id="nameO">Player O</span> Wins: <strong id="scoreO">0</strong></div>
    </div>

    <div class="btn-row">
      <button id="restart" class="btn">Restart</button>
      <button id="backMenu" class="btn outline">Back to Menu</button>
    </div>
  </section>

  <script src="global.js"></script>
  <script src="tictactoe.js"></script>
</body>
</html>
